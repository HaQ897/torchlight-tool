  // 总魔力封印必须与前面的“剩余魔力”使用同一套游戏取整后的实际数值。
  // 因此直接用剩余比例的补数计算，避免再次使用未取整的封印百分比。
  const actualTotalRatio=max>0?100-freeRatio:0;

  document.getElementById('total').textContent=actualTotalRatio.toFixed(2)+'%';
  document.getElementById('sealed').textContent=sealed;
  document.getElementById('remain').textContent=remain;

  const freeEl=document.getElementById('free');
  freeEl.textContent=freeRatio.toFixed(2)+'%';
  freeEl.classList.toggle('negative',freeRatio<0);

  const lifeTotalEl=document.getElementById('lifeTotal');
  lifeTotalEl.textContent=lifeTotal.toFixed(2)+'%';
  lifeTotalEl.classList.toggle('negative',lifeTotal>100);
  document.getElementById('lifeSealed').textContent=lifeSealed;
  document.getElementById('lifeRemain').textContent=lifeRemain;
  document.getElementById('lifeFree').textContent=(lifeMax>0?lifeRemain/lifeMax*100:100).toFixed(2)+'%';

  const st=document.getElementById('status'),
    manaOk=remain>=0,
    lifeOk=lifeRemain>=0;
  st.className=manaOk&&lifeOk?'ok':'bad';
  st.textContent=manaOk&&lifeOk
    ?'可以同时开启 4 个光环'
    :(!manaOk&&!lifeOk?'魔力和生命均不足，无法同时开启 4 个光环':(!manaOk?'魔力不足，无法同时开启 4 个光环':'生命不足，无法同时开启 4 个光环'));

  document.getElementById('detail').innerHTML=detail;
  saveLocalConfig();
}

function encodeConfig(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  let binary='';
  for(const b of bytes) binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeConfig(str){
  const base64=str.replace(/-/g,'+').replace(/_/g,'/');
  const padded=base64+'='.repeat((4-base64.length%4)%4);
  const binary=atob(padded);
  const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function getConfigState(){
  return {
    maxMana:Number(document.getElementById('maxMana').value)||0,
    maxLife:Number(document.getElementById('maxLife').value)||0,
    gear:Number(document.getElementById('gear').value)||0,
    passive:Number(document.getElementById('passive').value)||0,
    other:Number(document.getElementById('other').value)||0,
    path:document.getElementById('path').checked,
    auras:auras.map(a=>({
      on:!!a.on,
      base:Number(a.base)||0,
      supports:(a.supports||[]).map(s=>({name:s.name||'',level:Number(s.level)||1}))
    }))
  };
}
function applyConfigState(data){
  if(!data||typeof data!=='object') return;
  document.getElementById('maxMana').value=Math.max(0,Number(data.maxMana)||0);
  document.getElementById('maxLife').value=Math.max(0,Number(data.maxLife)||0);
  document.getElementById('gear').value=Number(data.gear)||0;
  document.getElementById('passive').value=Number(data.passive)||0;
  document.getElementById('other').value=Number(data.other)||0;
  document.getElementById('path').checked=!!data.path;
  if(Array.isArray(data.auras)){
    for(let i=0;i<4;i++){
      const s=data.auras[i];
      if(!s) continue;
      auras[i].on=!!s.on;
      auras[i].base=Math.max(0,Math.min(100,Number(s.base)||0));
      auras[i].supports=Array.isArray(s.supports)
        ? s.supports.slice(0,5).map(x=>({name:relevant.includes(x?.name)?x.name:'',level:Math.max(1,Math.min(40,Number(x?.level)||1))}))
        : [];
    }
  }
}

/* 紧凑配置链接：比完整 JSON/Base64 链接短很多；同时兼容旧版 ?config= 链接。 */
function encodeCompactConfig(obj){
  const globalPart=[
    Number(obj.maxMana)||0,
    Number(obj.maxLife)||0,
    Number(obj.gear)||0,
    Number(obj.passive)||0,
    Number(obj.other)||0,
    obj.path?1:0
  ].join(',');
  const auraPart=(obj.auras||[]).slice(0,4).map(a=>{
    const on=a?.on?1:0;
    const base10=Math.max(0,Math.min(1000,Math.round((Number(a?.base)||0)*10)));
    const base36=base10.toString(36).padStart(2,'0');
    const slots=(a?.supports||[]).slice(0,5).map(s=>{
      const id=Math.max(0,relevant.indexOf(s?.name));
      const skillId=(s?.name?String(id).padStart(2,'0'):'99');
      const lv=Math.max(1,Math.min(40,Number(s?.level)||1)).toString(36).padStart(2,'0');
      return skillId+lv;
    }).join('');
    return on+base36+slots;
  }).join(';');
  return globalPart+'|'+auraPart;
}
function decodeCompactConfig(code){
  const parts=code.split('|');
  if(parts.length<2) throw new Error('配置链接格式错误');
  const g=parts[0].split(',');
  const data={
    maxMana:Number(g[0])||0,
    maxLife:Number(g[1])||0,
    gear:Number(g[2])||0,
    passive:Number(g[3])||0,
    other:Number(g[4])||0,
    path:g[5]==='1',
    auras:[]
  };
  const auraStrings=parts[1].split(';');
  for(let i=0;i<4;i++){
    const s=auraStrings[i]||'0'+'000';
    const on=s[0]==='1';
    const base10=parseInt(s.slice(1,3),36);
    const supports=[];
    for(let p=3;p+4<=s.length;p+=4){
      const sid=s.slice(p,p+2);
      const lvRaw=s.slice(p+2,p+4);
      if(sid==='99') continue;
      const id=parseInt(sid,36);
      if(!Number.isInteger(id)||id<0||id>=relevant.length) continue;
      const level=Math.max(1,Math.min(40,parseInt(lvRaw,36)||1));
      supports.push({name:relevant[id],level});
    }
    data.auras.push({on,base:base10/10,supports});
  }
  return data;
}

const STORAGE_KEY='haq897_torchlight_tool_config_v1';
function saveLocalConfig(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(getConfigState()));}catch(err){console.warn('无法保存本地配置',err);}
}
function loadLocalConfig(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    applyConfigState(data);
    return true;
  }catch(err){console.warn('无法读取本地配置',err);return false;}
}
async function copyResult(){
  const text=[
    '哈秋 · 火炬工具｜魔力封印计算器',
    '魔力封印：'+document.getElementById('total').textContent,
    '已封印魔力：'+document.getElementById('sealed').textContent,
    '剩余魔力：'+document.getElementById('remain').textContent,
    '可用比例：'+document.getElementById('free').textContent,
    '生命封印：'+document.getElementById('lifeTotal').textContent,
    '已封印生命：'+document.getElementById('lifeSealed').textContent,
    '剩余生命：'+document.getElementById('lifeRemain').textContent,
    '生命可用比例：'+document.getElementById('lifeFree').textContent,
    document.getElementById('status').textContent
  ].join('\\n');
  const btn=document.getElementById('copyResult');
  const oldText=btn.textContent;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);}
    else{
      const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    }
    btn.textContent='已复制结果';
  }catch(err){btn.textContent='复制失败';}
  setTimeout(()=>{btn.textContent=oldText},1600);
}
function loadConfigFromUrl(){
  const params=new URL(location.href).searchParams;
  const compact=params.get('c');
  const legacy=params.get('config');
  const code=compact||legacy;
  if(!code) return false;
  try{
    applyConfigState(compact?decodeCompactConfig(code):decodeConfig(code));
    return true;
  }catch(err){
    console.warn('配置链接无法读取',err);
    return false;
  }
}
async function copyConfigLink(){
  const url=new URL(location.href);
  url.searchParams.delete('config');
  url.searchParams.set('c',encodeCompactConfig(getConfigState()));
  const link=url.toString();
  const btn=document.getElementById('copyConfig');
  try{
    await navigator.clipboard.writeText(link);
  }catch(err){
    const ta=document.createElement('textarea');
    ta.value=link;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const oldText=btn.textContent;
  btn.textContent='已复制配置链接';
  setTimeout(()=>{btn.textContent=oldText},1600);
}
