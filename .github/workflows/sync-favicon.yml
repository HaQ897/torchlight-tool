name: Sync GitHub Avatar Favicon

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-favicon.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest GitHub avatar
        run: |
          curl -L --fail --silent --show-error \
            "https://avatars.githubusercontent.com/u/339055766?v=4" \
            -o favicon.png

      - name: Verify image
        run: |
          file favicon.png
          python - <<'PY'
          from PIL import Image
          im = Image.open("favicon.png")
          print("size:", im.size)
          print("mode:", im.mode)
          if "A" in im.getbands():
              print("alpha:", im.getchannel("A").getextrema())
          PY

      - name: Commit updated favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png
          if git diff --cached --quiet; then
            echo "Favicon unchanged."
          else
            git commit -m "同步最新 GitHub 头像为 favicon"
            git push
          fi
