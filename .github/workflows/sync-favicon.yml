name: Sync GitHub Avatar Favicon

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-favicon.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest GitHub avatar
        run: |
          curl -L --fail --silent --show-error \
            "https://avatars.githubusercontent.com/u/339055766?v=4" \
            -o avatar.jpg

      - name: Remove only the connected white outer background
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick avatar.jpg \
              -alpha on \
              -fuzz 8% \
              -fill none \
              -draw "matte 0,0 floodfill" \
              -draw "matte 459,0 floodfill" \
              -draw "matte 0,459 floodfill" \
              -draw "matte 459,459 floodfill" \
              PNG32:favicon.png
          else
            convert avatar.jpg \
              -alpha on \
              -fuzz 8% \
              -fill none \
              -draw "matte 0,0 floodfill" \
              -draw "matte 459,0 floodfill" \
              -draw "matte 0,459 floodfill" \
              -draw "matte 459,459 floodfill" \
              PNG32:favicon.png
          fi

      - name: Verify favicon
        run: |
          file favicon.png
          if command -v magick >/dev/null 2>&1; then
            magick identify -format "size=%wx%h\nchannels=%[channels]\n" favicon.png
          else
            identify -format "size=%wx%h\nchannels=%[channels]\n" favicon.png
          fi

      - name: Commit updated favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png
          if git diff --cached --quiet; then
            echo "Favicon unchanged."
          else
            git commit -m "将最新 GitHub 头像转换为透明 favicon"
            git push
          fi
